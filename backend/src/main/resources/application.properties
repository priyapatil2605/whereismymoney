spring.application.name=whereismymoney-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/whereismymoney}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

claude.api.key=${CLAUDE_API_KEY:}
claude.api.url=https://api.anthropic.com/v1/messages
claude.model=claude-sonnet-4-6

ai.insights.enabled=${AI_INSIGHTS_ENABLED:false}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

admin.email=${ADMIN_EMAIL:admin@whereismymoney.com}

ml.service.url=http://127.0.0.1:8000